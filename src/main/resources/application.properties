# Aplicacion
spring.application.name=ConstruccionesMG
server.port=8080

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# MongoDB (real: descomenta para usar MongoDB local)
# spring.data.mongodb.uri=mongodb://localhost:27017/construccionesmg

# MongoDB embebida (desarrollo/pruebas sin instalar MongoDB)
spring.data.mongodb.database=construccionesmg
spring.data.mongodb.port=0
de.flapdoodle.mongodb.embedded.version=7.0.12

# Subida de archivos
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.construccionesmg=DEBUG
