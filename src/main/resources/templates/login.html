<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Iniciar sesion')}"></head>
<body class="bg-light">
<nav th:replace="~{fragments :: navbar}"></nav>

<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow">
                    <div class="card-body p-4">
                        <h2 class="text-center mb-4 text-dark-blue">Iniciar sesion</h2>
                        <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
                        <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
                        <div class="alert alert-info" th:if="${param.registered}">Registro exitoso. Ahora puedes iniciar sesion.</div>
                        <form th:action="@{/login}" method="post">
                            <div class="mb-3">
                                <label class="form-label">Usuario</label>
                                <input type="text" name="username" class="form-control" required autofocus>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Contrasena</label>
                                <input type="password" name="password" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-orange w-100">Ingresar</button>
                        </form>
                        <hr>
                        <p class="text-center mb-0">No tienes cuenta? <a th:href="@{/register}">Registrate</a></p>
                        <div class="mt-3 small text-muted">
                            <p class="mb-1">Cuentas de prueba:</p>
                            <ul class="mb-0">
                                <li>Admin: <strong>admin</strong> / <strong>admin123</strong></li>
                                <li>Cliente: <strong>cliente</strong> / <strong>cliente123</strong></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<footer th:replace="~{fragments :: footer}"></footer>
<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
