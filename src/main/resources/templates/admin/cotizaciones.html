<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Cotizaciones')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-3 col-lg-2 p-0">
            <div th:replace="~{fragments :: admin-sidebar}"></div>
        </div>
        <div class="col-md-9 col-lg-10 py-4 px-4">
            <h2 class="text-dark-blue mb-4">Solicitudes de cotizacion</h2>

            <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
            <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

            <div class="row g-4">
                <div class="col-md-6" th:each="c : ${cotizaciones}">
                    <div class="card shadow h-100">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-start">
                                <h5 class="card-title" th:text="${c.titulo}">Titulo</h5>
                                <span class="badge"
                                      th:classappend="${c.estado.name()} == 'PENDIENTE' ? 'bg-warning text-dark' : (${c.estado.name()} == 'RESPONDIDA' ? 'bg-success' : 'bg-info')"
                                      th:text="${c.estado.name()}">Estado</span>
                            </div>
                            <p class="text-muted small">
                                <i class="bi bi-calendar"></i> <span th:text="${#temporals.format(c.fechaSolicitud, 'dd/MM/yyyy HH:mm')}">Fecha</span>
                            </p>
                            <p class="card-text" th:text="${c.descripcion}">Descripcion</p>
                            <p class="mb-1"><strong>Tipo:</strong> <span th:text="${c.tipoTrabajo}">Tipo</span></p>
                            <p class="mb-1"><strong>Ubicacion:</strong> <span th:text="${c.ubicacion}">Ubicacion</span></p>
                            <p class="mb-1"><strong>Cliente ID:</strong> <span th:text="${c.clienteId}">ID</span></p>

                            <div th:if="${c.respuestaAdmin != null}" class="alert alert-light mt-3">
                                <strong>Respuesta:</strong> <span th:text="${c.respuestaAdmin}">Respuesta</span>
                            </div>

                            <div th:if="${c.pdfPath != null}" class="alert alert-info mt-3">
                                <strong><i class="bi bi-file-earmark-pdf"></i> PDF adjunto:</strong>
                                <a th:href="@{/uploads/} + ${c.pdfPath}" target="_blank" class="alert-link">Ver / descargar PDF</a>
                            </div>

                            <form th:action="@{/admin/cotizaciones/responder/{id}(id=${c.id})}" method="post" enctype="multipart/form-data" class="mt-3" th:if="${c.estado.name() != 'RESPONDIDA'}">
                                <div class="mb-2">
                                    <textarea name="respuesta" class="form-control" rows="2" placeholder="Escribe tu respuesta..." required></textarea>
                                </div>
                                <div class="mb-2">
                                    <label class="form-label small">Adjuntar PDF de cotizacion</label>
                                    <input type="file" name="pdf" class="form-control form-control-sm" accept=".pdf,application/pdf">
                                </div>
                                <button type="submit" class="btn btn-success btn-sm"><i class="bi bi-reply"></i> Responder</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
