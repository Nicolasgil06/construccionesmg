<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Clientes')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-3 col-lg-2 p-0">
            <div th:replace="~{fragments :: admin-sidebar}"></div>
        </div>
        <div class="col-md-9 col-lg-10 py-4 px-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="text-dark-blue">Clientes</h2>
                <a th:href="@{/admin/clientes/nuevo}" class="btn btn-success"><i class="bi bi-person-plus"></i> Nuevo cliente</a>
            </div>

            <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
            <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

            <div class="table-responsive">
                <table class="table table-striped">
                    <thead class="table-dark">
                    <tr>
                        <th>Usuario</th>
                        <th>Nombre</th>
                        <th>Email</th>
                        <th>Telefono</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="c : ${clientes}">
                        <td th:text="${c.username}">Usuario</td>
                        <td th:text="${c.nombre}">Nombre</td>
                        <td th:text="${c.email}">Email</td>
                        <td th:text="${c.telefono}">Telefono</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
