<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Mis Obras')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-3 col-lg-2 p-0">
            <div th:replace="~{fragments :: client-sidebar}"></div>
        </div>
        <div class="col-md-9 col-lg-10 py-4 px-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="text-dark-blue">Mis obras</h2>
                <a th:href="@{/client/cotizacion}" class="btn btn-orange"><i class="bi bi-envelope"></i> Solicitar cotizacion</a>
            </div>

            <form method="get" th:action="@{/client/proyectos}" class="row g-2 mb-3">
                <div class="col-md-3">
                    <select name="tipo" class="form-select">
                        <option value="" th:selected="${tipoSeleccionado == null || tipoSeleccionado == ''}">Todos los tipos</option>
                        <option th:each="t : ${tipos}" th:value="${t.name()}" th:text="${t.name() == 'REMODELACION' ? 'Remodelacion' : 'Nueva obra'}"
                                th:selected="${tipoSeleccionado == t.name()}">Tipo</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-outline-primary">Filtrar</button>
                </div>
            </form>

            <div class="row g-4">
                <div class="col-md-4" th:each="p : ${proyectos}">
                    <div class="card h-100 shadow-sm card-proyecto">
                        <img th:src="${p.imagenUrl}" class="card-img-top" alt="Proyecto">
                        <div class="card-body">
                            <span class="badge"
                                  th:classappend="${p.tipo.name()} == 'REMODELACION' ? 'badge-remodelacion' : 'badge-nueva'"
                                  th:text="${p.tipo.name() == 'REMODELACION' ? 'Remodelacion' : 'Nueva obra'}">Tipo</span>
                            <h5 class="card-title" th:text="${p.nombre}">Nombre</h5>
                            <p class="card-text text-muted" th:text="${#strings.abbreviate(p.descripcion, 100)}">Descripcion</p>
                            <p class="small text-muted"><i class="bi bi-geo-alt"></i> <span th:text="${p.ubicacion}">Ubicacion</span></p>
                            <a th:href="@{/client/proyectos/{id}(id=${p.id})}" class="btn btn-outline-primary btn-sm">Ver especificaciones</a>
                        </div>
                    </div>
                </div>
                <div class="col-12" th:if="${proyectos.isEmpty()}">
                    <div class="alert alert-info">No tienes obras registradas de este tipo.</div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
