<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Solicitar Cotizacion')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-3 col-lg-2 p-0">
            <div th:replace="~{fragments :: client-sidebar}"></div>
        </div>
        <div class="col-md-9 col-lg-10 py-4 px-4">
            <h2 class="text-dark-blue mb-4">Solicitar cotizacion</h2>
            <p class="text-muted">Completa el siguiente formulario para contactar al contratista y recibir una cotizacion personalizada.</p>

            <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
            <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

            <div class="card shadow">
                <div class="card-body">
                    <form th:action="@{/client/cotizacion}" th:object="${cotizacion}" method="post">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Titulo del trabajo</label>
                                <input type="text" th:field="*{titulo}" class="form-control" placeholder="Ej: Remodelacion de cocina" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Tipo de trabajo</label>
                                <select th:field="*{tipoTrabajo}" class="form-select" required>
                                    <option value="">Selecciona...</option>
                                    <option th:each="t : ${tipos}" th:value="${t}" th:text="${t}">Tipo</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Ubicacion</label>
                                <input type="text" th:field="*{ubicacion}" class="form-control" placeholder="Ej: Bogota, Colombia" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Descripcion detallada</label>
                                <textarea th:field="*{descripcion}" class="form-control" rows="5" placeholder="Describe el trabajo que necesitas..." required></textarea>
                            </div>
                        </div>
                        <div class="mt-4">
                            <button type="submit" class="btn btn-orange"><i class="bi bi-send"></i> Enviar solicitud</button>
                            <a th:href="@{/client/dashboard}" class="btn btn-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
